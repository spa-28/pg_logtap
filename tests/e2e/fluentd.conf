<system>
  log_level info
</system>

<source>
  @type http
  @id pg_logtap_http
  bind 0.0.0.0
  port 9880
</source>

<source>
  @type tcp
  @id pg_logtap_tcp
  bind 0.0.0.0
  port 5170
  tag pg_logtap_tcp
  delimiter "\n"

  <parse>
    @type json
  </parse>
</source>

<match pg_logtap_http>
  @type file
  @id pg_logtap_http_file
  path /fluentd/log/pg-logtap-http
  append true

  <buffer>
    @type file
    path /tmp/fluentd-buffer/http
    flush_mode interval
    flush_interval 1s
    flush_at_shutdown true
  </buffer>

  <format>
    @type json
  </format>
</match>

<match pg_logtap_tcp>
  @type file
  @id pg_logtap_tcp_file
  path /fluentd/log/pg-logtap-tcp
  append true

  <buffer>
    @type file
    path /tmp/fluentd-buffer/tcp
    flush_mode interval
    flush_interval 1s
    flush_at_shutdown true
  </buffer>

  <format>
    @type json
  </format>
</match>

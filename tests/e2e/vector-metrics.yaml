# M4 e2e receiver: scrape the worker's /metrics endpoint, write to a file.
sources:
  prom:
    type: prometheus_scrape
    endpoints:
      - http://pglogtap-pg:9187/metrics
    scrape_interval_secs: 1

sinks:
  file_out:
    type: file
    inputs: [prom]
    path: /var/log/vector-metrics.jsonl
    encoding: { codec: json }

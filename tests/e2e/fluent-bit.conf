[SERVICE]
    Flush             1
    Log_Level         info

[INPUT]
    Name              http
    Listen            0.0.0.0
    Port              9880
    Buffer_Max_Size   16M

[INPUT]
    Name              tcp
    Listen            0.0.0.0
    Port              5170
    Tag               pg_logtap_tcp
    Format            json
    Separator         \n
    Buffer_Size       16M

[OUTPUT]
    Name              file
    Match             pg_logtap_http
    Path              /var/log/fluent-bit
    File              pg-logtap-http.jsonl
    Format            plain
    Mkdir             true

[OUTPUT]
    Name              file
    Match             pg_logtap_tcp
    Path              /var/log/fluent-bit
    File              pg-logtap-tcp.jsonl
    Format            plain
    Mkdir             true

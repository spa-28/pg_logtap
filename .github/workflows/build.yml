name: build
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
      # The pgzx dependency runs pg_config at configure time (any zig build
      # invocation) and links libpq; any server-dev version will do here.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-server-dev-16 libpq-dev
      - run: zig build fmt --summary all
      - run: zig build lint --summary all
      - run: zig build test --summary all

  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v4
      - name: Install zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
      # ubuntu ships only one server-dev major; the rest come from PGDG
      # (the official PostgreSQL apt repository, manual repo setup).
      - run: |
          . /etc/os-release
          if ! apt-cache show postgresql-server-dev-${{ matrix.pg }} >/dev/null 2>&1; then
            sudo install -d /etc/apt/keyrings
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/keyrings/pgdg.asc >/dev/null
            echo "deb [signed-by=/etc/apt/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update
          fi
          sudo apt-get install -y postgresql-server-dev-${{ matrix.pg }} libpq-dev
      - run: scripts/test-matrix.sh 5 ${{ matrix.pg }}
        env:
          PATH: /usr/lib/postgresql/${{ matrix.pg }}/bin:/usr/local/bin:/usr/bin:/bin
      - uses: actions/upload-artifact@v4
        with:
          name: pg_logtap-pg${{ matrix.pg }}-amd64
          path: dist/pg${{ matrix.pg }}/lib/pg_logtap.so
          if-no-files-found: error

# Prometheus alert rules for pg_logtap (see docs/delivery.md for the contract).
# Load e.g.: prometheus --rules.alerts.file ... or wire into your rule_dirs.
groups:
  - name: pg_logtap
    rules:
      - alert: PgLogtapEventsLost
        expr: increase(pg_logtap_events_lost_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "pg_logtap lost events on {{ $labels.instance }}"
          description: >-
            Events are permanently gone. Causes, in order of likelihood:
            backlog overflow (receiver down or too slow with no fallback
            file — loss bounded by export_backlog_max); the fallback file's
            fallback_max_mb cap trimming undelivered members during a long
            outage (cross-check pg_logtap_events_compacted_total — the
            outage outlasted the queue); or an unreadable queue member
            skipped at replay. See docs/delivery.md.
      - alert: PgLogtapRingDropped
        expr: increase(pg_logtap_events_dropped_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "pg_logtap capture ring full on {{ $labels.instance }}"
          description: >-
            Events were dropped at capture time: the export worker is stalled
            or the capture rate exceeds the drain rate. Check the worker
            process and receiver latency.
      - alert: PgLogtapExportFailing
        expr: increase(pg_logtap_send_cycles_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "pg_logtap export failing on {{ $labels.instance }}"
          description: >-
            Sends to export_url have been failing for 5m. Events buffer in
            the bounded backlog (and the fallback queue, if set); they start
            dropping once it fills.
      - alert: PgLogtapFallbackQueueBroken
        expr: pg_logtap_fallback_broken == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "pg_logtap fallback queue disabled on {{ $labels.instance }}"
          description: >-
            The fallback file has foreign or corrupt framing and is no longer
            appended to or replayed: durability quietly degraded to the RAM
            backlog bound. Remove or fix the file, then repoint
            pg_logtap.export_fallback_file to a different path (a path-string
            change re-checks the file and clears the flag) or restart the
            worker.
      - alert: PgLogtapDnsFailing
        expr: pg_logtap_dns_fail_streak > 10
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "pg_logtap cannot resolve the export receiver on {{ $labels.instance }}"
          description: >-
            Consecutive failed getaddrinfo lookups for the export_url host.
            Delivery continues via the last-known-good address while it stays
            valid; check DNS/the receiver's network registration if it does
            not recover.
      - alert: PgLogtapFbSyncFailing
        expr: increase(pg_logtap_fb_sync_failures[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "pg_logtap fallback queue syncs failing on {{ $labels.instance }}"
          description: >-
            fdatasync on the fallback queue keeps failing: parked members are
            in the file and still replay, but an OS crash could lose them and
            the disk is not making the queue durable. The server-log WARNING
            fires once per failure streak; this counter is monotonic. Check
            the device holding the queue (and PGDATA).
      - alert: PgLogtapRedactPatternFailed
        expr: pg_logtap_redact_pattern_failed == 1
        labels:
          severity: warning
        annotations:
          summary: "pg_logtap redact_pattern is invalid on {{ $labels.instance }}"
          description: >-
            pg_logtap.redact_pattern did not compile and redaction by that
            layer is OFF (fail-open). The compile error text is in the server
            log. Fix the pattern; the gauge clears on the next successful
            compile.
